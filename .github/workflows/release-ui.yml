name: Release Tauri UI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf rpm
      - name: Build packages
        run: npm ci && npm run tauri build
      - name: Name release files
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/deb/*.deb release/hhd-fan-ui-linux-amd64.deb
          cp src-tauri/target/release/bundle/rpm/*.rpm release/hhd-fan-ui-linux-x86_64.rpm
          sha256sum release/* > release/SHA256SUMS
      - name: Build Arch package
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/work" -w /work archlinux:latest bash -lc '
            pacman -Syu --noconfirm base-devel nodejs npm rust cargo patchelf gtk3 webkit2gtk-4.1
            useradd -m builder
            chown -R builder /work
            su builder -c "cd /work/ui/packaging && makepkg --noconfirm --syncdeps --cleanbuild"
          '
          cp ui/packaging/*.pkg.tar.zst ui/release/hhd-fan-ui-linux-x86_64.pkg.tar.zst
          sha256sum ui/release/* > ui/release/SHA256SUMS
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ui/release/*
