[project]
name = "hhd-fan"
version = "4.1.10"
authors = [
  { name="Kapenekakis Antheas", email="pypi@antheas.dev" },
]
description = "Focused, safety-first handheld fan control service."
readme = "readme.md"
requires-python = ">=3.10"
license = {text = "LGPL-2.1-or-later"}
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
  "evdev>=1.6.1",
  "PyYAML>=6.0.1",
  "rich>=13.5.2",
  "setuptools>=65.5.0",
  "python-xlib>=0.33",
  "pyserial>=3.5",
  "pyroute2>=0.7.3",
  "PyGObject>=3.46.0",
  "dbus-python>=1.3.2",
]

[project.urls]
"Homepage" = "https://github.com/JosEffigy/hhd-fan"
"Bug Tracker" = "https://github.com/JosEffigy/hhd-fan/issues"

[project.entry-points."console_scripts"]
hhd-fan = "hhd.__main__:main"
hhd-fan-overlay = "hhd.fanctl:main"

[project.entry-points."hhd.plugins"]
adjustor_fan = "adjustor.fan_hhd:autodetect"
fan_overlay = "hhd.plugins.fan_overlay:autodetect"

[project.entry-points."hhd.i18n"]
hhd = "hhd.i18n:locales"

[project.entry-points."babel.extractors"]
hhd_yaml = "hhd.contrib.i18n:extract_hhd_yaml"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["hhd*", "adjustor*"]

[tool.setuptools.data-files]
"share/applications" = ["usr/share/applications/hhd-fan-overlay.desktop"]
"lib/systemd/system" = ["usr/lib/systemd/system/hhd_fan@.service"]
